<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <title>Ejercicio 2</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="mt-3 col">
                <label class="form-label">Nota primer parcial</label>
                <input type="number" class="form-control" id="valorN1">
            </div>
            <div class="mt-3 col">
                <label class="form-label">Nota segundo parcial</label>
                <input type="number" class="form-control" id="valorN2">
            </div>
            <div class="mt-3 col">
                <label class="form-label">Nota tecer parcial</label>
                <input type="number" class="form-control" id="valorN3">
            </div>
        </div>
        <div class="row">
            <div class="mt-3 col-4">
                <label class="form-label">Nota final</label>
                <input type="number" class="form-control" id="valorNotaFinal" readonly>
            </div>
        </div>
        <div class="row">
            <div class="mt-3 col-4">
                <button type="button" class="btn btn-success" onclick="calcular()">Calcular</button>
                <button type="button" class="btn btn-danger" onclick="limpiar()">Limpiar</button>
            </div>
        </div>
    </div>
    
    <script src="/js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
